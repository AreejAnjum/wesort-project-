seed: 7
experiment_name: wastevit-smoke
run_name: tiny-simclr
tracking_uri: sqlite:///mlflow.db
device: cpu
data:
  unlabeled_dir: data/toy/unlabeled
  train_manifest: data/toy/train.csv
  val_manifest: data/toy/val.csv
  test_manifest: data/toy/test.csv
  image_size: 32
model:
  backbone: tiny
  pretrained: false
  projection_dim: 16
training:
  batch_size: 8
  num_workers: 0
  ssl_epochs: 1
  probe_epochs: 2
  learning_rate: 0.001
  probe_learning_rate: 0.01
  weight_decay: 0.0001
  temperature: 0.2
