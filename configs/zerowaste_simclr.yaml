seed: 42
experiment_name: wastevit-zerowaste
run_name: simclr-resnet18
tracking_uri: sqlite:///mlflow.db
device: auto
metadata:
  dataset_name: ZeroWaste-s-and-ZeroWaste-f
  dataset_status: real-public-data
  run_purpose: waste-domain-ssl-experiment
data:
  unlabeled_dir: data/zerowaste-s/data
  train_manifest: data/manifests/train.csv
  val_manifest: data/manifests/val.csv
  test_manifest: data/manifests/test.csv
  image_size: 224
model:
  backbone: resnet18
  pretrained: true
  projection_dim: 128
training:
  batch_size: 64
  num_workers: 4
  ssl_epochs: 20
  probe_epochs: 15
  learning_rate: 0.0003
  probe_learning_rate: 0.001
  weight_decay: 0.0001
  temperature: 0.2
