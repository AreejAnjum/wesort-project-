[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wastevit-ssl"
version = "0.1.0"
description = "Self-supervised waste-domain adaptation with MLflow tracking"
requires-python = ">=3.10"
dependencies = [
  "mlflow>=2.12",
  "numpy>=1.24",
  "pillow>=10",
  "pyyaml>=6",
  "scikit-learn>=1.3",
  "timm>=1.0",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

